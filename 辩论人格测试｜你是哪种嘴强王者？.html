<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>辩论人格测试｜你是哪种嘴强王者？</title>
<style>
:root{--bg:#dde2e1;--ink:#4a4f57;--sub:#7b828b;--card:#f3efec;--yellow:#ffe27a;--yellow2:#f6d24f;--sage:#aebcaf;--rose:#d9b8b4;--blue:#a9b8c6;--mauve:#bcaec0;--line:#c9cfce;

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;line-height:1.6;min-height:100vh}
.wrap{max-width:460px;margin:0 auto;padding:22px 18px 40px}
.card{background:var(--card);border-radius:28px;padding:24px 20px;border:3px solid var(--ink);box-shadow:6px 6px 0 var(--yellow2)}
h1{font-size:30px;line-height:1.25;margin:10px 0 8px;letter-spacing:1px}
h1 span{background:var(--yellow);color:#4a4f57;padding:0 8px;border-radius:12px;display:inline-block;transform:rotate(-2deg)}
p{margin:6px 0}.sub{color:var(--sub);font-size:14px}
.btn{display:block;width:100%;border:3px solid var(--ink);background:var(--yellow);color:#4a4f57;font:inherit;font-weight:700;font-size:17px;padding:13px 16px;border-radius:999px;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;margin-top:16px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:var(--sage)}
.btn:focus-visible,.opt:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
.mascot{width:120px;height:104px;margin:6px auto 0;background:var(--yellow);border:3px solid var(--ink);border-radius:50% 50% 46% 46%;position:relative;animation:hop 1.6s ease-in-out infinite}
.mascot i{position:absolute;top:38px;width:11px;height:14px;background:var(--ink);border-radius:50%}
.mascot i.l{left:34px}.mascot i.r{right:34px}
.mascot b{position:absolute;left:50%;bottom:20px;width:26px;height:14px;margin-left:-13px;background:#a9747a;border:3px solid var(--ink);border-radius:4px 4px 16px 16px}
.mascot em{position:absolute;top:56px;width:16px;height:9px;background:var(--rose);border-radius:50%}
.mascot em.l{left:16px}.mascot em.r{right:16px}
.mascot u{position:absolute;right:-22px;bottom:2px;width:12px;height:34px;background:var(--blue);border:3px solid var(--ink);border-radius:8px;transform:rotate(25deg)}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-14px) scale(.97,1.04)}60%{transform:translateY(0) scale(1.05,.95)}}
@media (prefers-reduced-motion:reduce){.mascot{animation:none}}
.tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.tags span{background:var(--blue);color:#3f454d;border-radius:999px;padding:3px 12px;font-size:13px;border:2px solid var(--ink)}
.tags span:nth-child(2){background:var(--rose)}.tags span:nth-child(3){background:var(--sage)}
.bar{height:16px;border:3px solid var(--ink);border-radius:999px;background:var(--card);overflow:hidden}
.bar div{height:100%;background:var(--yellow2);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:14px;margin:6px 4px 14px;color:var(--sub)}
.q{font-size:20px;font-weight:700;margin:6px 0 16px;line-height:1.5}
.part{display:inline-block;background:var(--mauve);color:#3f454d;border-radius:12px;padding:1px 10px;font-size:13px;border:2px solid var(--ink)}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:3px solid var(--ink);border-radius:20px;padding:13px 15px;margin-bottom:12px;cursor:pointer;transition:background .1s}
.opt:hover{background:var(--yellow);color:#4a4f57}
.opt.pick{background:var(--yellow);color:#4a4f57}
.back{background:none;border:0;color:var(--sub);font:inherit;text-decoration:underline;cursor:pointer;margin-top:4px;padding:6px}
.rhead{text-align:center;border-radius:22px;padding:18px 10px;border:3px solid var(--ink);margin-bottom:14px}
.emo{font-size:60px;line-height:1.1}
.code{font-weight:800;letter-spacing:4px;font-size:15px;margin-top:4px}
.rname{font-size:28px;font-weight:800;margin:2px 0}
.quote{font-style:italic;font-size:15px;margin-top:6px}
.sec{background:var(--bg);border:2px dashed var(--ink);border-radius:18px;padding:10px 14px;margin-top:10px}
.sec h3{margin:0 0 2px;font-size:15px}
.sec p{margin:0;font-size:14.5px}
.roast{background:var(--yellow);color:#4a4f57;border-style:solid}
.hide{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
</style>
</head>

<div class="wrap">

<section id="s0" class="card" style="text-align:center">
  <div class="mascot"><i class="l"></i><i class="r"></i><em class="l"></em><em class="r"></em><b></b><u></u></div>
  <h1>辩论人格测试<br><span>你是哪种嘴强王者？</span></h1>

  <div class="tags"><span>逻辑 or 价值</span><span>进攻 or 防守</span><span>体系 or 应变</span></div>

<section id="s1" class="hide">

    <div id="opts"></div>
    <button class="back" id="bk">← 上一题（后悔药）</button>
  </div>

<section id="s2" class="hide">

      <div class="emo" id="emo"></div>

      <div class="rname" id="rn"></div>
      <div class="quote" id="qt"></div>

    <div class="sec roast"><h3>🤡 队友私下吐槽</h3><p id="roast"></p></div>

    <div class="sec"><h3>🪑 最适合的辩位</h3><p id="pos"></p></div>
    <div class="sec"><h3>🧩 最佳搭档</h3><p id="mate"></p></div>
    <div class="sec"><h3>🏋️ 练习小贴士</h3><p id="tip"></p></div>
    <button class="btn" id="share">复制结果，去群里炫耀</button>
    <button class="btn alt" id="again">再测一次（换个人格）</button>
  </div>
</section>
</div>
<div class="toast" id="toast"></div>

VDS:{e:"⚓",n:"定海针",c:"#b5c7c2",qt:"队伍乱的时候，我是那个把大家拉回主线的人。",pic:"团队稳定器，重视整体配合，守住己方价值立场，统筹全队叙事一致。",roast:"队里的“妈妈”，赛前负责买水、定闹钟、安抚情绪。",str:"全局观好，沟通力强，是队友信赖的精神支柱。",weak:"不够锋芒外露，关键时刻容易让出主动权。",pos:"队长、四辩总结、赛前协调",mate:"LAF 质询刀锋：他负责出刀，你负责擦刀。",tip:"给自己设一个进攻任务，每场至少主动发起一次强有力的质疑。"},

var ans=[],i=0;
var $=function(id){return document.getElementById(id)};
function show(n){["s0","s1","s2"].forEach(function(s,k){$(s).classList.toggle("hide",k!==n)});window.scrollTo(0,0)}
function render(){
  var q=Q[i],p=q[1].charAt(0);
  var pt="LV".indexOf(p)>=0?"思维取向":"AD".indexOf(p)>=0?"战场风格":"备战方式";
  $("part").textContent=pt;$("q").textContent=(i+1)+". "+q[0];
  $("pt").textContent=pt;$("cnt").textContent=(i+1)+" / 21";
  $("fill").style.width=(i/21*100)+"%";
  var box=$("opts");box.innerHTML="";
  for(var k=1;k<q.length;k++){(function(k){
    var b=document.createElement("button");b.className="opt"+(ans[i]===k?" pick":"");
    b.textContent="ABCD".charAt(k-1)+"　"+q[k].slice(2);
    b.onclick=function(){pick(k)};box.appendChild(b)})(k)}
  $("bk").style.visibility=i?"visible":"hidden";
}
function pick(v){
  ans[i]=v;
  if(i<20){i++;render()}else{finish()}
}
function finish(){
  var dims=[["L","V"],["A","D"],["S","F"]],code="";
  for(var d=0;d<3;d++){
    var a=0;for(var k=0;k<7;k++){if(ans[d*7+k]==="A")a++}
    code+=a>=4?dims[d][0]:dims[d][1];
  }
  var r=R[code];
  $("rh").style.background=r.c;$("rh").style.color="#3f454d";
  $("emo").textContent=r.e;$("code").textContent=code;$("rn").textContent=r.n;$("qt").textContent="“"+r.qt+"”";
  $("pic").textContent=r.pic;$("roast").textContent=r.roast;$("str").textContent=r.str;
  $("weak").textContent=r.weak;$("pos").textContent=r.pos;$("mate").textContent=r.mate;$("tip").textContent=r.tip;
  window.__txt="我的辩论人格是【"+code+"｜"+r.n+"】"+r.e+"\n“"+r.qt+"”\n队友吐槽：“"+r.roast+"”\n来测测你是哪种嘴强王者？";
  show(2);
}
$("go").onclick=function(){ans=[];i=0;render();show(1)};
$("bk").onclick=function(){if(i>0){i--;render()}};
$("again").onclick=function(){ans=[];i=0;show(0)};
function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(function(){e.classList.remove("on")},1800)}
$("share").onclick=function(){
  try{navigator.clipboard.writeText(window.__txt).then(function(){toast("已复制，去群里发吧 ✨")},function(){toast("复制失败，截图分享也行 📸")})}
  catch(e){toast("复制失败，截图分享也行 📸")}
};
</script>
